<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>OTP Page</title>
  <!-- Bootstrap CSS -->
  <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
  <style>
	/* Custom Styles */
	.otp-container {
	  min-height: 800px; /* Increased height */
	  display: flex;
	  justify-content: center;
	  align-items: center;
	}
	
	.otp-card {
	  width: 80%;
	  max-width: 500px;
	  padding: 50px;
	}
  
	/* Add space between input and button */
	.form-group {
	  margin-bottom: 50px; /* Adjust this value as needed */
	}

	/* Custom Toast Messages */
	#message-container {
		position: fixed;
		top: 20px;
		right: 20px;
		z-index: 9999;
		width: 320px;
	}
	.custom-toast {
		background: rgba(255, 255, 255, 0.95);
		backdrop-filter: blur(10px);
		border-radius: 8px;
		padding: 16px 20px;
		margin-bottom: 12px;
		box-shadow: 0 10px 30px rgba(0,0,0,0.1);
		border-left: 5px solid #333;
		display: flex;
		align-items: center;
		justify-content: space-between;
		animation: slideIn 0.5s ease forwards;
		transition: all 0.3s ease;
	}
	.custom-toast.success, .custom-toast.success_tag { border-left-color: #28a745; }
	.custom-toast.error, .custom-toast.danger, .custom-toast.error_tag { border-left-color: #dc3545; }
	
	.toast-content {
		color: #333;
		font-size: 14px;
		font-weight: 500;
		margin-right: 10px;
	}
	.toast-close {
		cursor: pointer;
		color: #999;
		font-size: 18px;
		line-height: 1;
	}
	@keyframes slideIn {
		from { transform: translateX(100%); opacity: 0; }
		to { transform: translateX(0); opacity: 1; }
	}
	@keyframes fadeOut {
		from { transform: translateX(0); opacity: 1; }
		to { transform: translateX(100%); opacity: 0; }
	}
  </style>
  
</head>
<body>
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-12">
        <div class="otp-container">
          <div class="card otp-card">
            <div class="card-body">
              <h3 class="card-title text-center">Enter OTP</h3>
              <form id="otpForm" action = "{% url 'otp_verification' %}" method="POST"  >
                {% csrf_token %}
                <div class="form-group">
                  <label for="otpInput">OTP</label>
                  <input type="text" class="form-control" id="otpInput" placeholder="Enter OTP" name="entered_otp" required>
                <button type="submit" class="btn btn-primary btn-block">Submit</button>
              </form>

              <!-- Global Message Container -->
              <div id="message-container">
                {% if messages %}
                    {% for message in messages %}
                        <div class="custom-toast {{ message.tags }}">
                            <div class="toast-content">{{ message }}</div>
                            <div class="toast-close" onclick="this.parentElement.style.animation='fadeOut 0.5s ease forwards'; setTimeout(() => this.parentElement.remove(), 500);">&times;</div>
                        </div>
                    {% endfor %}
                {% endif %}
              </div>

              </form>

              <div class="timeforotp d-flex justify-content-center">
                <div id="countdown-timer" class="small" >
                   <span id="timer"></span>
                </div>
                    
                <div id="otp-expired-message"  class="small" style="display: none; color: red;">
                    <a class="small text-dark pt-2" href="{% url 'send_otp' %}" id="resendlink">Resend OTP</a>
                </div>
            </div>    


            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

</body>
</html>
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script>
    var expirationTime = new Date("{{ expiration_time }}").getTime();
    let remainingtime = $("#countdown-timer");
    let resend = $("#resendlink");
    function UpdateOTPTimer() {
        var now = new Date().getTime(); 
        var timeDifference = Math.max(0, Math.floor((expirationTime - now) / 1000));
        console.log(timeDifference)
        

        if (timeDifference > 0) {
            let minutes = Math.floor(timeDifference / 60);
            let seconds = timeDifference % 60;

            let timerText = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
            remainingtime.text(timerText);
            $("#otp-expired-message").hide(); // Hide the message container
            remainingtime.show(); // Show the timer
    
        } else {
            remainingtime.hide();
            $("#otp-expired-message").show(); // Show the message container
          }

    }

    UpdateOTPTimer();
    setInterval(UpdateOTPTimer, 1000);

    $(document).ready(function () {
        $("form").on("submit", function (event) {
            var enteredOTP = $("#otpInput").val();
            var storedOTP = "{{ request.session.otp }}";

            if (enteredOTP !== storedOTP) {
                event.preventDefault();
                $(".error").text("Invalid OTP. Please try again.");
            }
        });
    });

</script>
<script>document.addEventListener('DOMContentLoaded', function() { const toasts = document.querySelectorAll('.custom-toast'); toasts.forEach(toast => { setTimeout(() => { if(toast) { toast.style.animation = 'fadeOut 0.5s ease forwards'; setTimeout(() => toast.remove(), 500); } }, 5000); }); });</script>
